"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

[hostname]
trim_at = "nvidia.com"
format = "[$hostname]($style) "

[username]
format="[$user]($style)@"

[package] 
disabled = true

[status]
disabled = true

[git_state]
disabled = true

[git_status]
disabled = true

[docker_context]
disabled = true

[container]
disabled = true
